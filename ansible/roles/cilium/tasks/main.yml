---

- name: Download and install Cilium CLI
  shell: |
    set -e
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail -O "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz"
    curl -L --fail -O "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"
    sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
    tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
    rm -f "cilium-linux-${CLI_ARCH}.tar.gz" "cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"
  args:
    executable: /bin/bash
    creates: /usr/local/bin/cilium

- name: Check if Cilium DaemonSet exists in kube-system
  become_user: ubuntu
  command: kubectl get daemonset cilium -n kube-system
  register: cilium_ds
  failed_when: false
  changed_when: false

- name: Install Cilium CNI v1.20.0
  become_user: ubuntu
  command: >
    cilium install 
    --version 1.20.0 
    --set ipam.operator.clusterPoolIPv4PodCIDRList={"10.244.0.0/16"} 
    --set nativeRoutingCIDR="10.0.0.0/16"
  when: cilium_ds.rc != 0