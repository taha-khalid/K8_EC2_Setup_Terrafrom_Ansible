---
- name: Install kubectl
  apt:
    name:
      - kubectl
    state: present
    update_cache: yes

- name: Hold kubectl at current version
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubectl

- name: Check if cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Initialize Kubernetes Control Plane with kubeadm
  command: kubeadm init --pod-network-cidr=192.168.0.0/16
  when: not admin_conf.stat.exists

- name: Create .kube directory for the ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy admin.conf to ubuntu user's kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Generate Kubeadm Join Command for Worker Nodes
  command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  
- name: Save join command into an Ansible fact
  set_fact:
    join_command: "{{ kubeadm_join_command.stdout }}"

- name: Display Kubeadm Join Command
  debug:
    msg: "Use the following command to join worker nodes to the cluster: {{ kubeadm_join_command.stdout }}"